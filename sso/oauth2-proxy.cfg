# oauth2-proxy config for Craft Suite + Google SSO
# Docs: https://oauth2-proxy.github.io/oauth2-proxy/configuration/overview
#
# Fill in from Google Cloud Console > APIs & Services > Credentials

provider = "google"
client_id = "YOUR_GOOGLE_CLIENT_ID.apps.googleusercontent.com"
client_secret = "YOUR_GOOGLE_CLIENT_SECRET"
# generate: openssl rand -base64 32
cookie_secret = "GENERATE_ME"

# oauth2-proxy is the front door: it authenticates, then proxies to serve.js
http_address = "127.0.0.1:4180"
upstreams = ["http://127.0.0.1:8091"]

redirect_url = "https://YOUR_DOMAIN/oauth2/callback"

cookie_secure = true
cookie_samesite = "lax"

# restrict who can log in — "*" allows any Google account (rely on consent
# screen test-user list instead), or list addresses/domains:
# email_domains = ["gmail.com", "yourdomain.com"]
# authenticated_emails_file = "/path/to/allowed-emails.txt"
email_domains = ["*"]

# pass the user's email to serve.js as X-Forwarded-User (storage scoping)
pass_user_headers = true
set_xauthrequest = true
