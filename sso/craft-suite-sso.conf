# systemd drop-in: ~/.config/systemd/user/craft-suite.service.d/sso.conf
# Locks serve.js to loopback and enables per-user storage scoping.
# Install:  mkdir -p ~/.config/systemd/user/craft-suite.service.d
#           cp craft-suite-sso.conf ~/.config/systemd/user/craft-suite.service.d/sso.conf
#           systemctl --user daemon-reload && systemctl --user restart craft-suite
[Service]
Environment=SUITE_HOST=127.0.0.1
Environment=SUITE_TRUST_USER=1
